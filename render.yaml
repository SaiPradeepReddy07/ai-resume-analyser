databases:
  - name: ai-resume-analyzer-db
    databaseName: ai_resume_analyzer
    user: ai_resume_analyzer
    plan: basic-256mb

services:
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-analyzer-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: ALLOWED_EXTENSIONS
        value: .pdf
